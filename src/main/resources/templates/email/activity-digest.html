<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:replace="~{email/layout :: layout(~{::content})}">
        <th:block th:fragment="content">
            <h1 style="margin:0 0 8px 0;font-size:22px;font-weight:600;color:#111827;"
                th:text="#{email.activityDigest.title(${orgName})}">
                Actividad en Stocka
            </h1>
            <p style="margin:0 0 20px 0;color:#6b7280;font-size:13px;"
               th:text="#{email.activityDigest.period(${total}, ${periodFrom}, ${periodTo})}">
                12 cambios entre el 29 oct 09:05 y el 29 oct 13:20.
            </p>
            <th:block th:each="section : ${sections}">
                <h2 style="margin:20px 0 8px 0;font-size:15px;font-weight:600;color:#111827;">
                    <span th:text="#{__${section.titleKey}__}">Artículos creados</span>
                    <span style="color:#6b7280;font-weight:400;" th:text="'(' + ${section.count} + ')'">(3)</span>
                </h2>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                    <tr th:each="line : ${section.items}">
                        <td style="padding:6px 0;border-top:1px solid #f3f4f6;font-size:14px;">
                            <a th:if="${line.url != null}" th:href="${line.url}" th:text="${line.name}"
                               style="color:#2563eb;text-decoration:none;font-weight:500;">Pastor</a>
                            <span th:if="${line.url == null}" th:text="${line.name}" style="font-weight:500;">Pastor</span>
                        </td>
                        <td style="padding:6px 0 6px 12px;border-top:1px solid #f3f4f6;font-size:13px;color:#6b7280;white-space:nowrap;"
                            th:text="${line.actorName}">Joan</td>
                        <td align="right" style="padding:6px 0 6px 12px;border-top:1px solid #f3f4f6;font-size:13px;color:#6b7280;white-space:nowrap;"
                            th:text="${line.time}">29 oct 09:05</td>
                    </tr>
                </table>
            </th:block>
            <p style="margin:28px 0 0 0;text-align:center;">
                <a th:href="${orgUrl}"
                   style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;"
                   th:text="#{email.activityDigest.cta.button}">
                    Ver la organización en Stocka
                </a>
            </p>
            <p style="margin:16px 0 0 0;color:#6b7280;font-size:12px;"
               th:text="#{email.activityDigest.footer}">
                Recibes este resumen porque así lo has elegido en tus preferencias de notificaciones.
            </p>
        </th:block>
    </th:block>
</body>
</html>
